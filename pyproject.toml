[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scpr-qubo"
version = "0.1.0"
description = "Exact SCPR to QUBO encoding with Beasley pre-reduction and post-QUBO variable fixing"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Abiola Tolulope Babatunde"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.9", "dimod>=0.12"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/ToluPeazy/scpr-qubo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
